version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y curl tar gzip make
      
      - run:
          name: Build k3s package
          command: |
            make VERSION=1.30.11+k3s1 ARCH=x86_64
      
      - run:
          name: Verify package structure
          command: |
            # Check if .opk file exists
            test -f build/k3s_1.30.11+k3s1_x86_64.opk
            echo "✓ Package file exists"
            
            # Extract and verify package contents
            cd build/k3s_1.30.11+k3s1_x86_64/pkg
            
            # Check for required files
            test -f debian-binary && echo "✓ debian-binary exists"
            test -f control.tar.gz && echo "✓ control.tar.gz exists"
            test -f data.tar.gz && echo "✓ data.tar.gz exists"
            
            # Verify control file content
            tar -xzf control.tar.gz
            grep -q "Package: k3s" control && echo "✓ Package name correct"
            grep -q "Version: 1.30.11+k3s1" control && echo "✓ Version correct"
            grep -q "Architecture: x86_64" control && echo "✓ Architecture correct"
            grep -q "containerd" control && echo "✓ containerd dependency present"
            
            # Verify data archive contents
            tar -tzf data.tar.gz | grep -q "usr/bin/k3s" && echo "✓ k3s binary present"
            tar -tzf data.tar.gz | grep -q "usr/bin/k3s-wrapper" && echo "✓ k3s-wrapper present"
            tar -tzf data.tar.gz | grep -q "etc/init.d/k3s" && echo "✓ init script present"
      
      - run:
          name: Verify script syntax
          command: |
            # Check init script syntax
            sh -n files/etc/init.d/k3s && echo "✓ Init script syntax valid"
            
            # Check wrapper script syntax
            sh -n files/usr/bin/k3s-wrapper && echo "✓ Wrapper script syntax valid"
      
      - store_artifacts:
          path: build/
          destination: packages
      
      - store_artifacts:
          path: build/k3s_1.30.11+k3s1_x86_64.opk
          destination: k3s_1.30.11+k3s1_x86_64.opk

  release:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y curl tar gzip make
            
            # Install ghr for GitHub releases
            curl -L https://github.com/tcnksm/ghr/releases/download/v0.16.2/ghr_v0.16.2_linux_amd64.tar.gz \
              | sudo tar --strip=1 -C /usr/bin -xzvf - ghr_v0.16.2_linux_amd64/ghr
      
      - run:
          name: Build all architectures
          command: |
            make build-all
      
      - run:
          name: Release to GitHub
          command: |
            ghr -t ${GITHUB_TOKEN} \
                -u ${CIRCLE_PROJECT_USERNAME} \
                -r ${CIRCLE_PROJECT_REPONAME} \
                -c ${CIRCLE_SHA1} \
                -delete ${CIRCLE_TAG} \
                build/

workflows:
  version: 2
  build-and-test-workflow:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
  
  release-workflow:
    jobs:
      - release:
          context: default
          filters:
            tags:
              only: /^v?\d+\.\d+\.\d+.*$/
            branches:
              ignore: /.*/
